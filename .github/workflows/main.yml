name: Tapiz Orquestador Principal

on:
  push:
    branches: ["main", "principal"]
  pull_request:
    branches: ["main", "principal"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tapiz-ci:
    name: Tapiz CI - Runner + Validacion
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verificar estructura
        run: |
          python -m py_compile runner.py

      - name: Ejecutar Runner
        run: |
          python runner.py

      - name: Validar salida estructural
        run: |
          python runner.py > tapiz_output.txt

          grep -q "||K||" tapiz_output.txt
          grep -q "Lambda" tapiz_output.txt
          grep -q "Decision:" tapiz_output.txt

          echo "=== VALIDACION TAPIZ ==="
          cat tapiz_output.txt

      - name: Resultado
        run: |
          echo "================================"
          echo " TAPIZ CI"
          echo "================================"
          echo "Runner: OK"
          echo "K: OK"
          echo "Lambda: OK"
          echo "Decision: OK"
          echo "================================"
