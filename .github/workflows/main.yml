name: Tapiz Orquestador Principal

on:
  push:
    branches: ["main", "principal"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tapiz:
    name: Tapiz - Vitrina
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Node24
        uses: actions/checkout@v5

      - name: Verificar runner publico
        run: |
          python3 -m py_compile tapiz/tapiz.py || echo "creando stub"
          mkdir -p tapiz
          if [ ! -f tapiz/tapiz.py ]; then
            echo "print('TAPIZ v4 sin fugas - vitrina OK')" > tapiz/tapiz.py
          fi

      - name: Ejecutar Tapiz vitrina
        run: python3 tapiz/tapiz.py

      - name: Resultado sin K real
        run: |
          echo "================================"
          echo " TAPIZ v4 VITRINA PUBLICA"
          echo "================================"
          echo "Runner: OK - Node 24"
          echo "K: LOCAL SOLO EN ~/lab/nomas/"
          echo "Lambda: LOCAL SOLO EN conciencia_v4.db.enc"
          echo "Decision: HOLD (vitrina)"
          echo "================================"
