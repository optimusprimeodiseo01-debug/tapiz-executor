name: Tapiz Orquestador Principal

on:
  push:
    branches: ["main", "principal"]
  pull_request:
    branches: ["main", "principal"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tapiz:
    name: Tapiz
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verificar runner
        run: |
          python -m py_compile runner.py

      - name: Ejecutar Tapiz
        run: |
          python runner.py

      - name: Validar Tapiz
        run: |
          python runner.py > tapiz_output.txt
          grep -q "||K||" tapiz_output.txt
          grep -q "Lambda" tapiz_output.txt
          grep -q "Decision:" tapiz_output.txt

      - name: Resultado
        run: |
          echo "================================"
          echo " TAPIZ"
          echo "================================"
          echo "Runner: OK"
          echo "K: OK"
          echo "Lambda: OK"
          echo "Decision: OK"
          echo "================================"
