name: Tapiz Main Orchestrator

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Para correrlo manual

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  MIN_GAUSS: 0.65 # Umbral del tapiz

jobs:
  tapiz-ci:
    name: 1. Tapiz CI - Test + Gauss
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      gauss: ${{ steps.gauss.outputs.gauss }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Lint + Format Check
        run: |
          deno fmt --check || echo "::warning::Formato incorrecto"
          deno lint

      - name: Tests + Coverage
        run: |
          deno test --coverage=./cov --coverage-dir=./cov \
            --trace-leaks --trace-ops --allow-all
          deno coverage ./cov --lcov > cov.lcov

      - name: Benchmarks
        run: deno bench --json > bench.json || echo "[]" > bench.json
        continue-on-error: true

      - name: Calcular GAUSS RESONANCE
        id: gauss
        run: |
          COV=$(grep -oP 'LF:\K\d+' cov.lcov | awk '{s+=$1} END{print s+0}')
          TL=$(grep -oP 'LH:\K\d+' cov.lcov | awk '{s+=$1} END{print s+0}')
          if [ "$COV" -eq 0 ]; then COVERAGE=0; else COVERAGE=$(echo "scale=2; ($COV-$TL)/$COV" | bc); fi
          
          if [ "$(jq length bench.json)" -eq 0 ]; then SPEED=0; else
            SPEED=$(jq '[.[].nanos] | add / length' bench.json)
            SPEED=$(echo "scale=3; 1000000 / ($SPEED + 1)" | bc)
          fi
          
          GAUSS=$(echo "scale=2; $COVERAGE*0.7 + $SPEED*0.3" | bc)
          echo "gauss=$GAUSS" >> $GITHUB_OUTPUT
          echo "=== GAUSS TAPIZ REPORT ==="
          echo "Coverage: $COVERAGE | Speed: $SPEED | GAUSS: $GAUSS | UMBRAL: $MIN_GAUSS"

